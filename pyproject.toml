[build-system]
# 77+ for the SPDX-string `license` / `license-files` fields below (PEP 639).
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "PhysicsAnalysisGUI"
version = "3.1.0"
description = "Desktop GUI for loading, visualising, and analysing physics lab data (TDT, Oxysoft, generic tabular, EFNMR/.pt2) and text field studies"
requires-python = ">=3.10"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "numpy",
    "matplotlib",
    "scipy",
    "openpyxl",
    "pandas",
    "packaging",
    "PyQt6",
    "pyqtgraph",
    "vispy==0.16.2",
    "ZaksPhysicsLibrary>=2026.9.28",
]

# Without this, setuptools' flat-layout auto-discovery refuses to guess
# between physicsanalysis_qt/ and any other top-level directory (e.g.
# packaging/, added for the distributed-zip README/thank-you files) -
# "Multiple top-level packages discovered in a flat-layout" - since
# nothing marks either one as *the* package to build. Being explicit
# here is also just more correct going forward, independent of this
# specific collision: new top-level directories (docs/, scripts/,
# whatever) won't silently break the build again.
[tool.setuptools.packages.find]
include = ["physicsanalysis_qt*"]
