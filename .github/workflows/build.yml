name: Build Executables (Windows + macOS)

# Runs when you push a version tag, e.g.:
#   git tag v2.12.1
#   git push origin v2.12.1
# Builds a native PyInstaller executable on each OS separately - it
# can't cross-compile, has to actually run on the target OS - packages
# each as a zip alongside the packaging/ collateral (README, thank-you
# note, the AGPL license text as LICENSE.txt, and macOS's Gatekeeper
# first-launch instructions), and attaches both as assets on a GitHub
# Release for that tag.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:  # manual "Run workflow" button, for testing without a tag

# The default GITHUB_TOKEN is read-only unless a workflow says otherwise
# (either here, or repo-wide under Settings -> Actions -> General ->
# Workflow permissions) - without this, softprops/action-gh-release below
# 403s trying to create/attach to the release.
permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset_name: PyAT-windows.zip
          - os: macos-latest
            asset_name: PyAT-macos.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pyinstaller

      # PhysicsAnalysis.spec looks for physicsanalysis_qt/assets/icon.icns
      # and falls back to no icon if it's missing (see the spec's own
      # comment) - built here from icon.png since .icns can only be
      # created with macOS's own iconutil, and there's no Mac available
      # to do this locally. icon.png is only 500x500, so the largest
      # (512x512 and 1024x1024) iconset entries are just upscaled and will
      # look soft - replace icon.png with a 1024x1024 source to fix that.
      - name: Generate macOS .icns from icon.png
        if: runner.os == 'macOS'
        run: |
          mkdir icon.iconset
          sips -z 16 16     physicsanalysis_qt/assets/icon.png --out icon.iconset/icon_16x16.png
          sips -z 32 32     physicsanalysis_qt/assets/icon.png --out icon.iconset/icon_16x16@2x.png
          sips -z 32 32     physicsanalysis_qt/assets/icon.png --out icon.iconset/icon_32x32.png
          sips -z 64 64     physicsanalysis_qt/assets/icon.png --out icon.iconset/icon_32x32@2x.png
          sips -z 128 128   physicsanalysis_qt/assets/icon.png --out icon.iconset/icon_128x128.png
          sips -z 256 256   physicsanalysis_qt/assets/icon.png --out icon.iconset/icon_128x128@2x.png
          sips -z 256 256   physicsanalysis_qt/assets/icon.png --out icon.iconset/icon_256x256.png
          sips -z 512 512   physicsanalysis_qt/assets/icon.png --out icon.iconset/icon_256x256@2x.png
          sips -z 512 512   physicsanalysis_qt/assets/icon.png --out icon.iconset/icon_512x512.png
          sips -z 1024 1024 physicsanalysis_qt/assets/icon.png --out icon.iconset/icon_512x512@2x.png
          iconutil -c icns icon.iconset -o physicsanalysis_qt/assets/icon.icns

      - name: Build with PyInstaller
        run: pyinstaller PhysicsAnalysis.spec

      # Not code-signed/notarized (that needs a paid $99/year Apple
      # Developer account) - without it, Gatekeeper blocks a plain
      # double-click on first launch on macOS. MACOS_INSTALL.md (repo
      # root) explains the right-click -> Open workaround (plus an
      # xattr fallback); only relevant there, so only copied into the
      # macOS zip below.
      #
      # The AGPL-3.0 requires the license text to travel with the binaries,
      # so the repo's LICENSE goes into both zips as LICENSE.txt (a .txt
      # extension so it opens with a double-click on Windows).
      - name: Stage packaging files (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "packaging\README.txt" "dist\"
          Copy-Item "packaging\THANK_YOU.txt" "dist\"
          Copy-Item "LICENSE" "dist\LICENSE.txt"

      - name: Stage packaging files (macOS)
        if: runner.os == 'macOS'
        run: |
          cp packaging/README.txt dist/
          cp packaging/THANK_YOU.txt dist/
          cp LICENSE dist/LICENSE.txt
          cp MACOS_INSTALL.md dist/

      - name: Zip the build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist\PyAT.exe, dist\README.txt, dist\THANK_YOU.txt, dist\LICENSE.txt -DestinationPath ${{ matrix.asset_name }}

      - name: Zip the build (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -r ../${{ matrix.asset_name }} PyAT.app README.txt THANK_YOU.txt LICENSE.txt MACOS_INSTALL.md

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.asset_name }}
